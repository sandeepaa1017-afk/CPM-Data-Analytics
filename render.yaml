previews:
  generation: "off"

services:
  - type: web
    name: cpm-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head && python seed.py
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_NAME
        value: CPM Common API
      - key: APP_ENV
        value: production
      - key: API_DOCS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cpm-production-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: '["https://cpm-management-dashboard.onrender.com"]'
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/firebase-service-account.json

  - type: web
    name: cpm-management-dashboard
    runtime: static
    rootDir: management-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cpm-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cpm-api.onrender.com"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000

databases:
  - name: cpm-production-db
    databaseName: cpm_db
    user: cpm_user
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
